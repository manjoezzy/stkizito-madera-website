<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - St. Kizito's Technical Institute</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary: #1a3a6b;
            --primary-light: #2756a0;
            --primary-dark: #0f2347;
            --gold: #f5c518;
            --gold-dark: #d4a017;
            --white: #ffffff;
            --light: #f0f4ff;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background circles */
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,197,24,0.08) 0%, transparent 70%);
            top: -200px; right: -200px;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            bottom: -150px; left: -150px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        /* Wave at bottom */
        .wave-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            overflow: hidden;
        }
        .wave-bottom svg { width: 100%; height: 100%; }

        .login-container {
            background: rgba(255,255,255,0.97);
            padding: 48px 44px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .school-badge {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 4px solid var(--gold);
            box-shadow: 0 8px 25px rgba(26,58,107,0.4);
        }
        .school-badge img {
            width: 58px; height: 58px;
            object-fit: contain;
            border-radius: 50%;
        }
        .school-badge i {
            font-size: 2.2rem;
            color: var(--gold);
        }

        .login-header h1 {
            color: var(--primary-dark);
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .gold-divider {
            width: 50px; height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 2px;
            margin: 14px auto 0;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: #fafafa;
            color: var(--primary-dark);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(245,197,24,0.15);
        }

        .form-group input:focus ~ i,
        .input-wrapper:focus-within i {
            color: var(--gold-dark);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(245,197,24,0.2), transparent);
            transition: left 0.4s ease;
        }

        .btn-login:hover::before { left: 0; }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(26,58,107,0.45);
        }

        .btn-login:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: #fef2f2;
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid var(--danger);
        }
        .error-message.show { display: flex; align-items: center; gap: 8px; }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-link a:hover { color: var(--gold-dark); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span { color: #9ca3af; font-size: 0.8rem; }

        .demo-info {
            background: linear-gradient(135deg, rgba(26,58,107,0.06), rgba(245,197,24,0.08));
            border: 1px solid rgba(245,197,24,0.3);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.82rem;
            color: #374151;
        }
        .demo-info strong { color: var(--primary); }

        .loading-spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .portal-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }
        .portal-links a {
            color: #6b7280;
            font-size: 0.82rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .portal-links a:hover { color: var(--primary); }
    </style>
</head>

<body>
    <div class="wave-bottom">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path d="M0,64 C360,120 1080,0 1440,64 L1440,120 L0,120 Z" fill="rgba(245,197,24,0.15)"/>
            <path d="M0,80 C480,20 960,120 1440,80 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.06)"/>
        </svg>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="school-badge">
                <img src="st kizitos technical institute madera photos/Institute Logo (1).jfif" alt="SKTIM Logo" 
                     onerror="this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'">
            </div>
            <h1>Admin Portal</h1>
            <p>St. Kizito's Technical Institute — Madera</p>
            <div class="gold-divider"></div>
        </div>

        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text"></span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" required placeholder="admin@stkizitos.edu" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> &nbsp;Sign In to Dashboard
            </button>
        </form>

        <div class="divider"><span>Demo Credentials</span></div>

        <div class="demo-info">
            <i class="fas fa-info-circle" style="color: var(--primary); margin-right:6px;"></i>
            <strong>Email:</strong> admin@stkizitos.edu &nbsp;|&nbsp; <strong>Password:</strong> admin123
        </div>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
            <div class="portal-links">
                <a href="student-portal.html"><i class="fas fa-user-graduate"></i> Student Portal</a>
                <a href="admissions.html"><i class="fas fa-clipboard-list"></i> Admissions</a>
            </div>
        </div>
    </div>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');

            hideError();

            if (!email || !password) { showError('Please fill in all fields'); return; }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                if (window.firebaseServices.isDemoAdminCredentials(email, password)) {
                    const demoSession = window.firebaseServices.startDemoSession();
                    if (demoSession) { window.location.href = 'dashboard.html'; return; }
                    showError('Demo login could not be started. Please try again.');
                    resetBtn();
                    return;
                }

                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const isAdmin = await window.firebaseServices.checkAdminStatus(userCredential.user);

                if (isAdmin) {
                    window.location.href = 'dashboard.html';
                } else {
                    await firebase.auth().signOut();
                    showError('Access denied. Your account is not authorized for admin access.');
                    resetBtn();
                }
            } catch (error) {
                const msgs = {
                    'auth/invalid-email': 'Invalid email address.',
                    'auth/user-disabled': 'This account has been disabled.',
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/invalid-credential': 'Invalid email or password.',
                    'auth/too-many-requests': 'Too many failed attempts. Please try again later.'
                };
                showError(msgs[error.code] || 'Login failed. Please try again.');
                resetBtn();
            }
        });

        function showError(message) {
            const el = document.getElementById('error-message');
            document.getElementById('error-text').textContent = message;
            el.classList.add('show');
        }
        function hideError() {
            document.getElementById('error-message').classList.remove('show');
        }
        function resetBtn() {
            const btn = document.getElementById('login-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> &nbsp;Sign In to Dashboard';
        }

        // Auto-redirect if already logged in
        const demoSession = window.firebaseServices.getDemoSession();
        if (demoSession) {
            window.location.href = 'dashboard.html';
        } else if (!window.firebaseServices.isDemoMode) {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (user) {
                    const isAdmin = await window.firebaseServices.checkAdminStatus(user);
                    if (isAdmin) window.location.href = 'dashboard.html';
                }
            });
        }
    </script>
</body>
</html>
